[project]
name = "beatcrate"
version = "2.11.0"
description = "A Mac app that picks Beatport new releases for your taste"
requires-python = ">=3.13"
dependencies = ["pywebview>=6.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.22"]

[project.scripts]
beatcrate = "beatcrate.cli:main"

[tool.setuptools]
packages = ["beatcrate", "beatcrate.app"]

[tool.setuptools.package-data]
"beatcrate.app" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
