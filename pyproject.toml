[project]
name = "beat50"
version = "3.0.0"
description = "A Mac app that picks Beatport new releases for your taste"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pywebview>=6.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.22"]

[project.scripts]
beat50 = "beat50.cli:main"

[tool.setuptools]
packages = ["beat50", "beat50.app"]

[tool.setuptools.package-data]
"beat50.app" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
